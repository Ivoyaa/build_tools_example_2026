$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: 1.0.0-M15
jvm:
  name: temurin:17
projects:
  core:
    extends: template-common
  core-test:
    extends: template-common
    dependsOn: core
    dependencies: org.scalameta::munit:1.1.1
    isTestProject: true
  server:
    extends: template-common
    dependsOn: core
    dependencies:
      - com.softwaremill.sttp.tapir::tapir-core:1.12.3
      - com.softwaremill.sttp.tapir::tapir-json-circe:1.12.3
      - com.softwaremill.sttp.tapir::tapir-jdkhttp-server:1.12.3
    platform:
      mainClass: demo.server.Main
  server-test:
    extends: template-common
    dependsOn: server
    dependencies: org.scalameta::munit:1.1.1
    isTestProject: true
templates:
  template-common:
    platform:
      name: jvm
    scala:
      options: -encoding utf8 -feature -unchecked
      strict: true
      version: 3.8.4
